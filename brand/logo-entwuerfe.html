<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>Logo-Entwürfe – Draft Partners</title>
  <link rel="stylesheet" href="/assets/site.css">
  <style>
    body { padding: 40px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 40px; margin-top: 32px; }
    .grid figure { margin: 0; }
    .grid figcaption { margin-top: 12px; color: var(--muted); font-size: 14px; }
    .sizes { display: flex; gap: 16px; align-items: end; margin-top: 16px; }
    svg text { font-family: "Clash Grotesk", system-ui, sans-serif; font-weight: 500; }
  </style>
</head>
<body>
  <h1>Logo-Entwürfe</h1>
  <div class="grid">
    <figure>
      <svg width="216" height="216" viewBox="0 0 216 216" role="img" aria-label="Entwurf A">
        <rect width="216" height="216" fill="#c6f19d"/>
        <text x="108" y="140" text-anchor="middle" font-size="104" letter-spacing="-6" fill="#0f1f10">DP</text>
      </svg>
      <figcaption>A – DP auf Lindgrün, eckig</figcaption>
    </figure>
    <figure>
      <svg width="216" height="216" viewBox="0 0 216 216" role="img" aria-label="Entwurf B">
        <rect width="216" height="216" fill="#0f1f10"/>
        <text x="108" y="140" text-anchor="middle" font-size="104" letter-spacing="-6" fill="#c6f19d">DP</text>
      </svg>
      <figcaption>B – DP auf Waldgrün, eckig</figcaption>
    </figure>
    <figure>
      <svg width="216" height="216" viewBox="0 0 216 216" role="img" aria-label="Entwurf C">
        <rect width="216" height="216" fill="#ffffff"/>
        <text x="34" y="182" font-size="150" letter-spacing="-10" fill="#0f1f10">dp</text>
        <rect x="160" y="34" width="22" height="22" fill="#3fa35a"/>
      </svg>
      <figcaption>C – dp klein, Punkt in Statusgrün (Ampel-Bezug)</figcaption>
    </figure>
    <figure>
      <svg width="216" height="216" viewBox="0 0 216 216" role="img" aria-label="Entwurf D">
        <rect width="216" height="216" fill="#0f1f10"/>
        <text x="24" y="100" font-size="48" letter-spacing="-2" fill="#ffffff">Draft</text>
        <text x="24" y="152" font-size="48" letter-spacing="-2" fill="#c6f19d">Partners</text>
      </svg>
      <figcaption>D – Wortmarke zweizeilig</figcaption>
    </figure>
  </div>

  <h2 style="margin-top:64px">Kleine Größen (Favicon, App-Liste)</h2>
  <div class="sizes">
    <svg width="48" height="48" viewBox="0 0 216 216"><rect width="216" height="216" fill="#c6f19d"/><text x="108" y="140" text-anchor="middle" font-size="104" letter-spacing="-6" fill="#0f1f10">DP</text></svg>
    <svg width="32" height="32" viewBox="0 0 216 216"><rect width="216" height="216" fill="#c6f19d"/><text x="108" y="140" text-anchor="middle" font-size="104" letter-spacing="-6" fill="#0f1f10">DP</text></svg>
    <svg width="16" height="16" viewBox="0 0 216 216"><rect width="216" height="216" fill="#c6f19d"/><text x="108" y="140" text-anchor="middle" font-size="104" letter-spacing="-6" fill="#0f1f10">DP</text></svg>
    <svg width="48" height="48" viewBox="0 0 216 216"><rect width="216" height="216" fill="#0f1f10"/><text x="108" y="140" text-anchor="middle" font-size="104" letter-spacing="-6" fill="#c6f19d">DP</text></svg>
    <svg width="32" height="32" viewBox="0 0 216 216"><rect width="216" height="216" fill="#0f1f10"/><text x="108" y="140" text-anchor="middle" font-size="104" letter-spacing="-6" fill="#c6f19d">DP</text></svg>
    <svg width="16" height="16" viewBox="0 0 216 216"><rect width="216" height="216" fill="#0f1f10"/><text x="108" y="140" text-anchor="middle" font-size="104" letter-spacing="-6" fill="#c6f19d">DP</text></svg>
  </div>
</body>
</html>
